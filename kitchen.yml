driver:
  name: vagrant

provisioner:
  name: chef_infra
  policyfile: Policyfile.rb
  product_name: chef
  product_version: <%= ENV['CHEF_VERSION'] %>
  deprecations_as_errors: true
  enforce_idempotency: true
  multiple_converge: 2
  chef_license: accept-no-persist

verifier:
  name: inspec
  # <% if ENV['FIREWALL_TEST_RUN_LIST'] %>
  inspec_tests:
    - path: test/integration/removal
  inputs:
    removal_type: <%= ENV['FIREWALL_TEST_RUN_LIST'] %>
    removal_backend: <%= ENV['FIREWALL_TEST_BACKEND'] || 'auto' %>
    # <% end %>

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: debian-12
  - name: debian-13
  - name: fedora-latest
  - name: ubuntu-22.04
  - name: ubuntu-24.04

suites:
  - name: default
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'default' %>

  - name: firewalld
    includes:
      - amazonlinux-2023
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'firewalld' %>

  - name: ufw
    includes:
      - debian-12
      - debian-13
      - ubuntu-22.04
      - ubuntu-24.04
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'ufw' %>

  - name: iptables
    includes:
      - almalinux-8
      - almalinux-9
      - amazonlinux-2023
      - centos-stream-9
      - fedora-latest
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'iptables' %>
    attributes:
      firewalld_test:
        backend: iptables

  - name: nftables
    includes:
      - debian-12
      - debian-13
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'nftables' %>

  - name: firewalld-dbus
    includes:
      - debian-12
      - debian-13
      - fedora-latest
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'firewalld_dbus' %>

  - name: windows
    includes:
      - windows-latest
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'windows' %>
